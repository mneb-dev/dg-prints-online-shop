<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="DG Prints online shop — custom prints, stickers, tarpaulins and 3D prints." />
    <title>DG Prints - Shop</title>
    <script>
      try {
        var theme = localStorage.getItem("dgprints_theme");
        var isDark =
          theme === "dark" ||
          ((theme === "system" || !theme) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
